# Configures `flutter analyze` (the code checker).
# Starts from Flutter's recommended lints, then adds a few stricter rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - functions/**
    # Generated code (freezed / json_serializable / riverpod_generator).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Generated by `flutterfire configure`.
    - lib/firebase_options.dart
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Generated code may use annotations the analyzer doesn't recognize.
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
